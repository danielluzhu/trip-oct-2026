name: Flight
description: Add your flight in or out, so it shows on the trip site's Flights page.
title: "Flight: "
labels: ["flight"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per flight — add a second one for your return. To change anything later, edit this issue (… menu → Edit); to remove it, close the issue. Don't put confirmation codes here: the repo is public.
  - type: input
    id: traveler
    attributes:
      label: Who
      placeholder: Your name (or names, if you're flying together)
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Direction
      options:
        - Arriving
        - Departing
    validations:
      required: true
  - type: input
    id: airline
    attributes:
      label: Airline
      placeholder: United
  - type: input
    id: flight_number
    attributes:
      label: Flight number
      placeholder: UA 1234 (list each leg if you connect, e.g. UA 1234 / UA 567)
    validations:
      required: true
  - type: input
    id: from
    attributes:
      label: From
      placeholder: SFO
  - type: input
    id: to
    attributes:
      label: To
      placeholder: FCA
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: 2026-10-15
    validations:
      required: true
  - type: input
    id: depart_time
    attributes:
      label: Departs (local time)
      placeholder: "9:05 AM"
  - type: input
    id: arrive_time
    attributes:
      label: Arrives (local time)
      placeholder: "12:40 PM"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: Need a ride from the airport, landing late, etc.
